          sudo apt-get install -y -qq mozart2 >/dev/null 2>&1 || true

      - name: Set up V
        if: matrix.language == 'v' || matrix.language == 'v_alt' || matrix.language == 'v_threads'
        run: |
          sudo apt-get update -qq >/dev/null 2>&1 || true
          sudo apt-get install -y -qq vlang >/dev/null 2>&1 || true

      - name: Set up Hy
        if: matrix.language == 'hy' || matrix.language == 'hylang'
        run: |
          pip install hy >/dev/null 2>&1 || true

      - name: Set up TypeScript (tsx)
        if: matrix.language == 'typescript_alt'
        run: |
          npm install -g tsx typescript >/dev/null 2>&1 || true

      - name: Set up Julia
        if: matrix.language == 'julia' || matrix.language == 'julia_threads'
        run: |
          sudo apt-get update -qq >/dev/null 2>&1 || true
          sudo apt-get install -y -qq julia >/dev/null 2>&1 || true

      - name: Set up MATLAB
        if: matrix.language == 'matlab'
        uses: matlab-actions/setup-matlab@v3
        with:
          release: R2023b

      - name: Build and benchmark ${{ matrix.language }}
        run: |
          chmod +x scripts/ci_run.sh
          ./scripts/ci_run.sh "${{ matrix.language }}"

      - name: Upload result artifact
        uses: actions/upload-artifact@v7
        with:
          name: bench-result-${{ matrix.language }}
          path: benchmark/result_*.json
          retention-days: 30

  aggregate:
    name: Aggregate results & update README
    needs: benchmark
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: always()
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Download all result artifacts
        uses: actions/download-artifact@v8
        with:
          path: benchmark
          merge-multiple: true

      - name: Aggregate into results.json + markdown table
        run: python3 scripts/aggregate.py

      - name: Splice table into README.md
        run: python3 scripts/patch_readme.py README.md benchmark/table.md

      - name: Commit README and results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md benchmark/results.json benchmark/table.md
          if ! git diff --cached --quiet; then
            git commit -m "chore: update benchmark results [skip ci]"
            git remote set-url origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
            git pull --rebase origin "${{ github.ref_name }}" || true
            git push origin "${{ github.ref_name }}"
          fi
