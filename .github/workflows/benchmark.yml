            curl -fsSL https://github.com/odin-lang/Odin/releases/latest/download/odin-ubuntu-16-04-amd64.zip -o /tmp/odin.zip 2>/dev/null &&
            unzip -o /tmp/odin.zip -d /tmp/odin && export PATH="/tmp/odin:$PATH" || true
