          - { language: browser_js, os: ubuntu-latest }
          - { language: cpp_threads, os: ubuntu-latest }
          - { language: cpp_jthread, os: ubuntu-latest }
          - { language: crossbeam, os: ubuntu-latest }
          - { language: async_std, os: ubuntu-latest }
          - { language: smol, os: ubuntu-latest }
