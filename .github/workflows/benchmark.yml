          - { language: rayon, os: ubuntu-latest }
          - { language: rayon2, os: ubuntu-latest }
          - { language: tokio_alt, os: ubuntu-latest }
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python (for bench.py)
        uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      # Official toolchain setups (fast, cached) where available — always latest stable.
      - name: Set up Go
        if: matrix.language == 'go'
        uses: actions/setup-go@v5
        with:
          go-version: "stable"

      - name: Set up Rust toolchain
        if: contains(fromJSON('["rust","rust_tokio2","rust_channels","rust_channels2","rust_mpsc","crossbeam","rayon","rayon2","std_thread","gtk","gtk_rs","tokio_alt","tokio_threads","async_std","smol"]'), matrix.language)
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          channel: "stable"

      - name: Set up Java (latest LTS for virtual threads)
        if: matrix.language == 'java'
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Set up Node.js
        if: matrix.language == 'nodejs'
        uses: actions/setup-node@v7
        with:
          node-version: "latest"

      - name: Set up Ruby
        if: matrix.language == 'ruby'
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"

      - name: Set up .NET SDK
        if: matrix.language == 'dotnet'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0"

      - name: Set up Dart SDK
        if: matrix.language == 'dart'
        uses: dart-lang/setup-dart@v1

      - name: Set up Mono (F#)
        if: matrix.language == 'fsharp'
        run: |
          sudo apt-get update -qq >/dev/null 2>&1 || true
          sudo apt-get install -y -qq mono-complete >/dev/null 2>&1 || true

      - name: Set up Scala CLI
        if: matrix.language == 'scala'
        run: |
          sudo apt-get update -qq >/dev/null 2>&1 || true
          sudo apt-get install -y -qq scala-cli >/dev/null 2>&1 || true

      - name: Set up OCaml
        if: matrix.language == 'ocaml'
        run: |
          sudo apt-get update -qq >/dev/null 2>&1 || true
          sudo apt-get install -y -qq ocaml opam >/dev/null 2>&1 || true

      - name: Set up PHP + Composer
        if: matrix.language == 'php'
        run: |
          sudo apt-get update -qq >/dev/null 2>&1 || true
          sudo apt-get install -y -qq php composer >/dev/null 2>&1 || true

      - name: Set up Clojure
        if: matrix.language == 'clojure'
        run: |
          curl -fsSL https://download.clojure.org/install/linux-install-1.11.1.sh -o /tmp/clojure-install.sh &&
            chmod +x /tmp/clojure-install.sh && sudo /tmp/clojure-install.sh || true

      - name: Set up Groovy
        if: matrix.language == 'groovy'
        run: |
          sudo apt-get update -qq >/dev/null 2>&1 || true
          sudo apt-get install -y -qq groovy >/dev/null 2>&1 || true

      - name: Set up PyPy
