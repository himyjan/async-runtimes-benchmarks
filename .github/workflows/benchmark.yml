name: Benchmark async runtimes

on:
  workflow_dispatch: # manual trigger
  push: # keep results fresh on changes to benchmarks
    branches: [main]
    paths:
      - "scripts/**"
      - "**/*.{rs,go,py,js,rb,cs,java,jl,hs,exs,kt,ts,pl,cr,nim,v,d,erl,raku,rkt,adb,zig}"

permissions:
  contents: write

jobs:
  benchmark:
    name: ${{ matrix.language }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          # language              OS
          - { language: cpp, os: ubuntu-latest }
          - { language: c, os: ubuntu-latest }
          - { language: swift, os: macos-latest }
          - { language: ruby, os: ubuntu-latest }
          - { language: python, os: ubuntu-latest }
